# Tomcat
server:
  port: 9207

# Spring
spring:
  application:
    # 应用名称
    name: spzx-order
  profiles:
    # 环境配置
    active: dev
  main:
    allow-bean-definition-overriding: true #当遇到同样名字的时候，是否允许覆盖注册
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        server-addr: 127.0.0.1:8848
      config:
        # 配置中心地址
        server-addr: 127.0.0.1:8848
        # 配置文件格式
        file-extension: yml
        # 共享配置
        shared-configs:
          - application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}

# Feign 远程调用配置
feign:
  # 开启熔断器，fallbackFactory降级才会生效（需要引入spring-cloud-starter-circuitbreaker-resilience4j依赖）
  circuitbreaker:
    enabled: true
  client:
    config:
      default:
        # 连接超时2秒、读取超时3秒，避免慢依赖拖垮本服务线程池
        connectTimeout: 2000
        readTimeout: 3000
        loggerLevel: basic